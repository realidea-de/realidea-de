name: Security

# Secret scanning and dependency audit gate. Referenced by ci-doctor.yml and
# .cursor/rules/security-standards.md.

on:
  push:
    branches: [main, staging]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Audit dependencies
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            echo "::notice::No pnpm-lock.yaml — skipping dependency audit (IaC-only repo)."
            exit 0
          fi
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=moderate
